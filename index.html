<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo Activity Calendar</title>
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0d1117);--panel:light-dark(#f6f8fa,#161b22);--line:light-dark(#d0d7de,#30363d);
  --ink:light-dark(#1f2328,#e6edf3);--mute:light-dark(#59636e,#9198a1);--acc:light-dark(#1f883d,#3fb950);
  --c0:light-dark(#ebedf0,#161b22);--c1:light-dark(#9be9a8,#0e4429);--c2:light-dark(#40c463,#006d32);
  --c3:light-dark(#30a14e,#26a641);--c4:light-dark(#216e39,#39d353);--bad:light-dark(#cf222e,#f85149)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:clamp(20px,4vw,48px) 16px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 24px}
form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-height:44px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#repo{flex:1 1 280px}
button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
details{color:var(--mute);font-size:14px;margin-bottom:20px}
details input{width:100%;margin-top:8px}
#status{min-height:24px;color:var(--mute);font-size:14px}
#status.err{color:var(--bad)}
.card{border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:12px;display:none}
.card.on{display:block}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:14px}
.head a{color:var(--ink);font-weight:700;font-size:18px;text-decoration:none;overflow-wrap:anywhere}
.head span{color:var(--mute);font-size:14px}
.scroll{overflow-x:auto;padding-bottom:6px}
.cal{display:grid;grid-template-columns:28px auto;gap:4px;width:max-content}
.months{grid-column:2;display:grid;grid-auto-flow:column;grid-auto-columns:13px;gap:3px;font-size:12px;color:var(--mute);height:16px}
.months span{white-space:nowrap}
.days{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:12px;color:var(--mute)}
.days span{line-height:13px}
.grid{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.grid i{border-radius:3px;background:var(--c0);outline:1px solid light-dark(#1f23280d,#ffffff0d);outline-offset:-1px}
.grid i[data-l="1"]{background:var(--c1)}.grid i[data-l="2"]{background:var(--c2)}
.grid i[data-l="3"]{background:var(--c3)}.grid i[data-l="4"]{background:var(--c4)}
.grid i.x{visibility:hidden}
.legend{display:flex;gap:3px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.stats div{background:var(--panel);border-radius:10px;padding:12px 14px}
.stats b{display:block;font-size:24px;line-height:1.2}
.stats small{color:var(--mute);font-size:13px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:9}
.note{color:var(--mute);font-size:13px;margin-top:16px}
@media(prefers-reduced-motion:reduce){#tip{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Repo activity calendar</h1>
  <p class="sub">Commits per day over the last year for any public GitHub repo.</p>
  <form id="f">
    <input id="repo" placeholder="owner/repo or GitHub URL" autocomplete="off" spellcheck="false" aria-label="Repository">
    <button id="go">Show</button>
  </form>
  <details>
    <summary>Token (optional, for private repos or rate limits)</summary>
    <input id="token" type="password" placeholder="ghp_… – stays in this browser only" autocomplete="off">
  </details>
  <div id="status" role="status"></div>
  <section class="card" id="out">
    <div class="head"><a id="name" href="#" target="_blank" rel="noopener"></a><span id="range"></span></div>
    <div class="scroll">
      <div class="cal">
        <div class="months" id="months"></div>
        <div class="days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
    <div class="legend">Less <i style="background:var(--c0)"></i><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i> More</div>
    <div class="stats" id="stats"></div>
    <p class="note">Counts commits on the default branch (GitHub's commit activity stats).</p>
  </section>
</main>
<div id="tip"></div>
<script>
{
const $ = id => document.getElementById(id);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k,v){ try { v ? localStorage.setItem(k,v) : localStorage.removeItem(k); } catch {} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = d => d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

function parseRepo(s){
  s = s.trim().replace(/\.git$/,'').replace(/\/+$/,'');
  const m = s.match(/(?:github\.com[\/:])?([\w.-]+)\/([\w.-]+)$/);
  return m ? m[1] + '/' + m[2] : null;
}

function status(msg, err){ $('status').textContent = msg; $('status').className = err ? 'err' : ''; }

async function fetchActivity(repo, token){
  const headers = {Accept:'application/vnd.github+json'};
  if (token) headers.Authorization = 'Bearer ' + token;
  for (let i = 0; i < 8; i++){
    const r = await fetch(`https://api.github.com/repos/${repo}/stats/commit_activity`, {headers});
    if (r.status === 202){ status(`GitHub is computing stats for ${repo}… (try ${i+1})`); await sleep(2000); continue; }
    if (r.status === 204) return [];
    if (r.status === 404) throw new Error('Repo not found (private repos need a token).');
    if (r.status === 401) throw new Error('Token was rejected.');
    if (r.status === 403 || r.status === 429){
      const reset = r.headers.get('x-ratelimit-reset');
      throw new Error('Rate limit hit' + (reset ? `, resets at ${new Date(reset*1000).toLocaleTimeString()}` : '') + '. Add a token to raise it.');
    }
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    return r.json();
  }
  throw new Error('GitHub is still computing stats. Try again in a minute.');
}

function level(n, max){
  if (!n) return 0;
  const q = n / max;
  return q > .75 ? 4 : q > .5 ? 3 : q > .25 ? 2 : 1;
}

function render(repo, weeks){
  const days = [];
  weeks.forEach(w => w.days.forEach((c, i) => days.push({d:new Date((w.week + i*86400)*1000), c})));
  const today = new Date();
  const max = Math.max(1, ...days.map(x => x.c));
  const plural = n => n === 1 ? '' : 's';

  $('grid').innerHTML = days.map((x, i) => {
    const future = x.d > today;
    return `<i class="${future ? 'x' : ''}" data-l="${level(x.c,max)}" data-i="${i}"></i>`;
  }).join('');

  let months = '', last = -1;
  weeks.forEach((w, i) => {
    const m = new Date(w.week*1000 + 6*86400000).getMonth();
    months += `<span>${m !== last && i < weeks.length - 2 ? MONTHS[m] : ''}</span>`;
    last = m;
  });
  $('months').innerHTML = months;

  const past = days.filter(x => x.d <= today);
  const total = past.reduce((a, x) => a + x.c, 0);
  const active = past.filter(x => x.c).length;
  const best = past.reduce((a, x) => x.c > a.c ? x : a, {c:0});
  let run = 0, longest = 0;
  past.forEach(x => { run = x.c ? run + 1 : 0; longest = Math.max(longest, run); });
  let current = 0;
  for (let i = past.length - 1; i >= 0; i--){
    if (past[i].c) current++;
    else if (i === past.length - 1) continue;
    else break;
  }
  const wd = [0,0,0,0,0,0,0];
  past.forEach(x => wd[x.d.getDay()] += x.c);
  const busiestWd = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][wd.indexOf(Math.max(...wd))];

  const stats = [
    [total.toLocaleString(), 'commits in the last year'],
    [active, `active day${plural(active)}`],
    [best.c ? best.c : '–', best.c ? `best day, ${fmt(best.d)}` : 'best day'],
    [longest, `longest streak (day${plural(longest)})`],
    [current, `current streak (day${plural(current)})`],
    [total ? busiestWd : '–', 'busiest weekday']
  ];
  $('stats').innerHTML = stats.map(([v, l]) => {
    const b = document.createElement('b'); b.textContent = v;
    const s = document.createElement('small'); s.textContent = l;
    return `<div>${b.outerHTML}${s.outerHTML}</div>`;
  }).join('');

  $('name').textContent = repo;
  $('name').href = 'https://github.com/' + repo;
  $('range').textContent = past.length ? `${fmt(past[0].d)} – ${fmt(past[past.length-1].d)}` : '';
  $('out').classList.add('on');
  status(total ? '' : 'No commits on the default branch in the last year.');

  const tip = $('tip');
  $('grid').onmousemove = e => {
    const el = e.target.closest('i');
    if (!el || el.classList.contains('x')){ tip.style.opacity = 0; return; }
    const x = days[+el.dataset.i];
    tip.textContent = `${x.c || 'No'} commit${plural(x.c)} on ${fmt(x.d)}`;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width/2 - tip.offsetWidth/2)) + 'px';
    tip.style.top = (r.top - tip.offsetHeight - 6) + 'px';
    tip.style.opacity = 1;
  };
  $('grid').onmouseleave = () => tip.style.opacity = 0;
}

async function load(input){
  const repo = parseRepo(input);
  if (!repo){ status('Enter it as owner/repo, e.g. torvalds/linux', true); return; }
  const token = $('token').value.trim();
  store.set('rac-token', token);
  store.set('rac-repo', repo);
  const url = new URL(location.href);
  if (url.protocol.startsWith('http')){ url.searchParams.set('repo', repo); history.replaceState(null, '', url); }
  $('go').disabled = true;
  status('Loading ' + repo + '…');
  try { render(repo, await fetchActivity(repo, token)); }
  catch (e){ status(e.message === 'Failed to fetch' ? 'Could not reach GitHub.' : e.message, true); }
  finally { $('go').disabled = false; }
}

$('f').addEventListener('submit', e => { e.preventDefault(); load($('repo').value); });
$('token').value = store.get('rac-token');
const start = new URLSearchParams(location.search).get('repo') || store.get('rac-repo');
if (start){ $('repo').value = start; load(start); }
}
</script>
</body>
</html>
